# ================================
# DATABASE CONFIG ? LOCAL POSTGRES
# ================================
# Matches your local pgAdmin/PostgreSQL 16 install. No SSL needed locally.
# Update DB_PASSWORD below to your actual local Postgres password if different.

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crmdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Prachi_0813}

# Do not hardcode a driver class. Spring Boot detects it from the JDBC URL.

# ================================
# JPA / HIBERNATE
# ================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ================================
# JWT
# ================================
# Local-only default so you don't need to set an env var just to run
# on your machine. DO NOT reuse this value when we deploy to Render ?
# we'll generate a proper random secret at that point.
jwt.secret=${JWT_SECRET:localdev_only_secret_key_do_not_use_in_production_123456}

# ================================
# CONNECTION POOL
# ================================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ================================
# SERVER
# ================================

server.port=${PORT:8080}
spring.application.name=crm-lite

# ================================
# LOGGING
# ================================
# Slightly more verbose locally so you can see what's happening.

logging.level.root=INFO
logging.level.com.crm.crm_lite=DEBUG
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# ================================
# AI KEY
# ================================

groq.api.key=${GROQ_API_KEY:}

# ================================
# REDIS ? local install
# ================================
# If your local Redis isn't running, this still won't crash the app ?
# RedisConfig.java's error handler catches the failure and falls back
# to hitting the DB directly. Start Redis locally if you want to actually
# test the caching behavior: redis-server (or via your Redis Windows install).

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.cache.type=redis

# ================================
# CORS ? local frontend
# ================================
# Your React dev server default port. Adjust if you run it elsewhere.

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}