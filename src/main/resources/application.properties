# ================================
# DATABASE CONFIG
# ================================

# Use PostgreSQL on Render via SPRING_DATASOURCE_URL
# Local dev falls back to H2 file-based DB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Do not hardcode a driver class. Spring Boot detects it from the JDBC URL.
# If needed, set SPRING_DATASOURCE_DRIVER on Render.

# ================================
# JPA / HIBERNATE
# ================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
jwt.secret=${JWT_SECRET:verysecretkeyverysecretkeyverysecretkey}
# ================================
# CONNECTION POOL
# ================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ================================
# SERVER
# ================================

server.port=${PORT:8080}
spring.application.name=crm-lite

# ================================
# LOGGING
# ================================

logging.level.root=WARN
logging.level.com.crm.crm_lite=INFO
logging.level.org.springframework.security=DEBUG

# ================================
# AI KEY
# ================================

groq.api.key=${GROQ_API_KEY:}