# ================================
# DATABASE CONFIG (SMART FALLBACK)
# ================================

# Use PostgreSQL if env vars exist, else fallback to H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# ================================
# JPA / HIBERNATE
# ================================

# Safe option (does NOT auto-change schema)
spring.jpa.hibernate.ddl-auto=update

# Show SQL (disable later if needed)
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# IMPORTANT: prevents lazy loading crashes
spring.jpa.open-in-view=false

# ================================
# CONNECTION POOL (IMPORTANT FOR NEON)
# ================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ================================
# SERVER
# ================================

server.port=${PORT:8080}

# ================================
# AI KEY
# ================================

groq.api.key=${GROQ_API_KEY}